[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "data-pipeline-env"
version = "1.0.0"
description = "Data Pipeline Debugging Environment for OpenEnv — AI agents diagnose and fix real-world data pipeline issues"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "openenv-core>=0.1.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.25.0",
]
inference = [
    "openai>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["data_pipeline_env*", "server*"]
